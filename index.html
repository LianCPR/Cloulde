<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#FFF8F3" />
    <meta
      name="description"
      content="Cloudé — lưu trữ ảnh gốc chất lượng cao, sắp xếp theo album và chia sẻ riêng tư bằng liên kết."
    />
    <title>Cloudé — Kho ảnh gốc của bạn</title>
    <!--
      Thẻ xem trước khi dán liên kết vào Zalo/Messenger/Facebook. Với một sản
      phẩm mà cách chia sẻ chính là gửi liên kết, không có mấy thẻ này thì liên
      kết hiện ra trống trơn và trông như hỏng.

      Cố ý KHÔNG có og:image: ảnh xem trước cần một URL tuyệt đối, mà tên miền
      triển khai chưa biết lúc build. Thẻ tiêu đề + mô tả vẫn tạo được khung xem
      trước hợp lệ.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Cloudé" />
    <meta property="og:title" content="Cloudé — Kho ảnh gốc của bạn" />
    <meta
      property="og:description"
      content="Lưu trữ ảnh gốc chất lượng cao và chia sẻ riêng tư bằng liên kết. Không nén lại, không đổi định dạng, không ghi đè màu sắc."
    />
    <meta name="twitter:card" content="summary" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      Inter: font sans-serif cho toàn bộ giao diện.
      Playfair Display: serif dự phòng cho các ký tự tiếng Việt mà font display
      LHanoienne không có (cơ chế fallback theo từng glyph của trình duyệt).
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300..700&family=Playfair+Display:wght@400..700&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      Cloudé cần JavaScript để hoạt động. Vui lòng bật JavaScript trong trình
      duyệt của bạn.
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
